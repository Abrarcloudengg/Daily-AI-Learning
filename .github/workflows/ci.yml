name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check src tests scripts

      - name: ruff format --check
        run: python -m ruff format --check src tests scripts

      - name: mypy
        run: python -m mypy src

  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # One Windows leg, because the path handling and console-encoding code
        # exists specifically for Windows and deserves a real runner.
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: End-to-end smoke test (no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # Every command below must work without OPENROUTER_API_KEY. If one of
      # them starts demanding a key, that is a regression worth failing on.
      - name: Validate curriculum
        run: daily-ai validate

      - name: Diagnostics
        run: daily-ai doctor || true

      - name: Peek at the next topic
        run: daily-ai next

      - name: Dry run
        run: daily-ai generate --dry-run --no-git

      - name: Render README
        run: daily-ai readme

      - name: README must be reproducible
        run: |
          if ! git diff --quiet -- README.md; then
            echo "::error title=README drift::daily-ai readme changed README.md. Run it locally and commit the result."
            git --no-pager diff -- README.md
            exit 1
          fi

      - name: Legacy script entry points still work
        run: |
          python scripts/generator.py --dry-run --no-git
          python -c "from scripts.topic_selector import get_next_topic; print(get_next_topic())"
          python -c "from scripts.readme_updater import update_readme; update_readme()"

      - name: Module invocation
        run: python -m daily_ai_learning version
