name: Daily AI Learning

on:
  workflow_dispatch:

  schedule:
    - cron: '30 15 * * *'

permissions:
  contents: write

concurrency:
  group: daily-ai-learning
  cancel-in-progress: false

jobs:
  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/generator.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          MSG=$(python -c "import json;p=json.load(open('data/progress.json'));print('Day %d: %s' % (len(p['completed']), p['current_topic']))")

          git commit -m "$MSG"

          # A scheduled run can race with a local push; rebase before pushing.
          git pull --rebase origin main
          git push origin main
