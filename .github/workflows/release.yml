name: Release

# Semantic versioning: tag `vX.Y.Z`, push the tag, and this builds the
# distributions, verifies the tag matches the version in pyproject.toml, and
# opens a GitHub Release with the CHANGELOG section attached.
#
#   git tag -a v2.0.0 -m "v2.0.0" && git push origin v2.0.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      # A tag that disagrees with pyproject.toml is how a project ends up with
      # two different "2.0.0" artifacts in the wild.
      - name: Tag must match package version
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=${TAG_VERSION} pyproject=${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error title=Version mismatch::Tag ${TAG} does not match pyproject.toml version ${PKG_VERSION}."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Extract changelog section
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Everything between this version's heading and the next one.
          awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for ${VERSION}." > release-notes.md
          fi
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            release-notes.md

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
