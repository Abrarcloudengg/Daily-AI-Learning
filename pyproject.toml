[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ai-learning"
version = "2.0.0"
description = "An autonomous curriculum generator: one AI-written programming lesson every day, committed by GitHub Actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abrar Patel" }]
keywords = [
    "ai",
    "automation",
    "curriculum",
    "education",
    "github-actions",
    "learning",
    "llm",
    "openrouter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Abrarcloudengg/Daily-AI-Learning"
Documentation = "https://abrarcloudengg.github.io/Daily-AI-Learning/"
Repository = "https://github.com/Abrarcloudengg/Daily-AI-Learning"
Issues = "https://github.com/Abrarcloudengg/Daily-AI-Learning/issues"
Changelog = "https://github.com/Abrarcloudengg/Daily-AI-Learning/blob/main/CHANGELOG.md"

[project.scripts]
daily-ai = "daily_ai_learning.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_ai_learning = ["py.typed"]

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # The scripts/ shims exist in order to emit exactly this warning.
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["daily_ai_learning"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

# ---------------------------------------------------------------------------
# Linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PTH", # prefer pathlib
    "RET", # return statements
    "ARG", # unused arguments
    "TID", # tidy imports
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # call in a default argument — deliberate for `sleep=time.sleep`
    "RUF001", # "ambiguous" unicode: the README is full of box drawing and arrows
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # the sys.path bootstrap must run before the imports
"tests/*.py" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["daily_ai_learning"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
